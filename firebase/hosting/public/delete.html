<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot — Delete your account</title>
  <style>
    :root { color-scheme: light dark; --fg:#111; --muted:#666; --bg:#f5f5f6; --card:#fff; --line:#ddd; --red:#d71921; }
    @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f2; --muted:#9a9a9f; --bg:#000; --card:#151517; --line:#26262a; } }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-family: ui-monospace, monospace; letter-spacing:.12em; text-transform:uppercase; font-size:20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:20px; margin-top:20px; }
    button { font:inherit; border:0; border-radius:999px; padding:12px 20px; cursor:pointer; background:var(--fg); color:var(--bg); }
    button.danger { background:var(--red); color:#fff; }
    button:disabled { opacity:.5; cursor:default; }
    #status { color:var(--muted); min-height:1.6em; }
    label { display:flex; gap:10px; align-items:flex-start; margin:16px 0; }
  </style>
</head>
<body>
<main>
  <h1>Delete your Dot account</h1>
  <p>This permanently deletes your encrypted task data stored in the cloud, your encrypted key backup record, and your Dot account.
     It can't be undone. You can also do this in the app: Settings → Account &amp; sync → Delete account.</p>

  <div class="card">
    <p id="who">Sign in with the Google account you use in Dot.</p>
    <button id="signin">Sign in with Google</button>
    <div id="confirm" hidden>
      <label><input type="checkbox" id="sure"> I understand my tasks will be permanently deleted.</label>
      <button id="delete" class="danger" disabled>Delete everything</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
</main>

<script src="/__/firebase/11.10.0/firebase-app-compat.js"></script>
<script src="/__/firebase/11.10.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/11.10.0/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/delete.js"></script>
</body>
</html>
