<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot — private tasks</title>
  <style>
    :root { color-scheme: light dark; --fg:#111; --muted:#666; --bg:#f5f5f6; --red:#d71921; }
    @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f2; --muted:#9a9a9f; --bg:#000; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
    main { text-align:center; padding:32px 16px; }
    .dot { width:56px; height:56px; border-radius:50%; border:3px solid var(--fg); display:grid; place-items:center; margin:0 auto 24px; }
    .dot::after { content:""; width:20px; height:20px; border-radius:50%; background:var(--red); }
    h1 { font-family: ui-monospace, monospace; letter-spacing:.2em; }
    a { color: inherit; }
  </style>
</head>
<body>
<main>
  <div class="dot"></div>
  <h1>DOT</h1>
  <p>Tasks that ring like a call — end-to-end encrypted.</p>
  <p><a href="privacy">Privacy policy</a> · <a href="delete">Delete your account</a> ·
     <a href="https://github.com/berlinflix/dot-tasks">Source code</a></p>
</main>
</body>
</html>
