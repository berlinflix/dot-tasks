name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json is not committed. Use the real one from the GOOGLE_SERVICES_JSON secret
      # (base64) when it's set, otherwise a placeholder — enough to build and test, as CI never calls Firebase.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          else
            cp .github/ci/google-services.placeholder.json app/google-services.json
          fi

      - name: Unit tests
        run: ./gradlew :core:domain:test testDebugUnitTest --continue

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble
        run: ./gradlew assembleDebug

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Rules tests (emulator)
        working-directory: firebase
        run: |
          npm --prefix rules-test install
          npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-dot "npm --prefix rules-test test"
