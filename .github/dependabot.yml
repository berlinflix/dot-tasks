version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      firebase:
        patterns: ["com.google.firebase*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /firebase/rules-test
    schedule:
      interval: monthly
    groups:
      # firebase and @firebase/rules-unit-testing require each other as peers, so they must move together.
      rules-test:
        patterns: ["*"]
